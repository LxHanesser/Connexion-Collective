name: npm-audit

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: npm audit (report only)
        run: |
          npm audit --package-lock-only --json > npm-audit.json || true
          node -e "const j=require('./npm-audit.json'); console.log('vulnerabilities:', JSON.stringify(j.metadata.vulnerabilities));"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: error
