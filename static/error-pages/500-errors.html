<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Service temporarily unavailable · Connexion Collective</title>
    <link rel="stylesheet" href="/error-pages/error.css" />
  </head>
  <body data-code="5xx">
    <div class="lang-switch">
      <button class="pill" type="button" data-set-lang="zh" aria-pressed="true">中文</button>
      <button class="pill" type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>

    <main class="cf-page">
      <section class="cf-original cf-native" lang="en" aria-label="Cloudflare 5xx error">
        ::CLOUDFLARE_ERROR_500S_BOX::
      </section>

      <section class="site-note" aria-labelledby="site-note-title">
        <p class="note-label" data-note-label>站点说明 / Site note</p>
        <h2 id="site-note-title" data-note-title>关于这次访问</h2>

        <div class="support-block" data-server>
          <div class="server-panel">
            <span class="server-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" />
                <path d="M12 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <circle cx="12" cy="16.2" r="1" fill="currentColor" />
              </svg>
            </span>
            <div>
              <p data-server-line>边缘节点暂时无法取得页面。这通常是短时故障或维护，不代表你的请求有问题。稍后刷新通常可以恢复。</p>
              <p data-server-line2>如果长时间（超过 24 小时）无法访问且依然出现此错误页面，请联系网站管理员。</p>
              <p class="contact-line">
                <a href="https://github.com/LxHanesser/Connexion-Collective/issues" data-github target="_blank" rel="noopener noreferrer">GitHub 联系</a>
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/error-pages/error.js"></script>
  </body>
</html>
