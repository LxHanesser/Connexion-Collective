<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Destructive attack path: once the management plane falls, production data and same-account backups are deleted together; an offline immutable copy is the last line">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#d7dee7; stroke-width:1.5; rx:12; }
      .warn { fill:#fff7ed; stroke:#c2410c; stroke-width:1.5; rx:12; }
      .acc { fill:#f0f9f4; stroke:#2e8555; stroke-width:1.5; rx:12; }
      .t { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill:#1c1e21; }
      .h { font-size:13.5px; font-weight:600; }
      .s { font-size:11px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a6); }
      .note { font-size:11.5px; fill:#475569; }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#f8fafc"/>
  <text class="t h" x="30" y="34">Destructive attack: data and backups deleted together</text>

  <rect class="b" x="30" y="58" width="200" height="80"/>
  <text class="t h" x="130" y="88" text-anchor="middle">Management plane</text>
  <text class="t s" x="130" y="110" text-anchor="middle">credentials / permissions taken</text>

  <path class="ar" d="M230 98 H258"/>
  <rect class="b" x="258" y="58" width="200" height="80"/>
  <text class="t h" x="358" y="88" text-anchor="middle">Bulk operations</text>
  <text class="t s" x="358" y="110" text-anchor="middle">delete / wipe jobs</text>

  <path class="ar" d="M458 98 H486"/>
  <rect class="warn" x="486" y="58" width="210" height="80"/>
  <text class="t h" x="591" y="88" text-anchor="middle">Production deleted</text>
  <text class="t s" x="591" y="110" text-anchor="middle">VMs / databases / files</text>

  <path class="ar" d="M696 98 H724"/>
  <rect class="warn" x="724" y="58" width="246" height="80"/>
  <text class="t h" x="847" y="88" text-anchor="middle">Backups deleted</text>
  <text class="t s" x="847" y="110" text-anchor="middle">same account, same delete rights</text>

  <text class="t note" x="486" y="164">One set of credentials means one set of delete permissions — any number of copies is really one.</text>

  <rect class="acc" x="30" y="188" width="450" height="72"/>
  <text class="t h" x="50" y="214">Offline / immutable copy</text>
  <text class="t s" x="50" y="236">object lock (WORM), cold storage, disconnected disk; deletion needs separate rights</text>

  <rect class="b" x="500" y="188" width="470" height="72"/>
  <text class="t h" x="520" y="214">3-2-1-1-0</text>
  <text class="t s" x="520" y="236">3 copies · 2 media · 1 off-site · 1 offline/immutable · 0 failed restores</text>
</svg>
