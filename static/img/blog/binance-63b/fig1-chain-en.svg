<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="The five-stage Binance attack chain: two delivery attempts reach developer endpoints, an internal AI tool is used to pivot to wallet team members, a deployment token left on a laptop opens the signing service, and a persistent delegation is written on-chain">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#ffffff; stroke:#d7dee7; stroke-width:1.5; rx:12; }
      .acc { fill:#f0f9f4; stroke:#2e8555; stroke-width:1.5; rx:12; }
      .warn { fill:#fff7ed; stroke:#c2410c; stroke-width:1.5; rx:12; }
      .t { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill:#1c1e21; }
      .h { font-size:13.5px; font-weight:600; }
      .s { font-size:11px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a2); }
      .note { font-size:11.5px; fill:#475569; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#f8fafc"/>
  <text class="t h" x="30" y="34">From a job posting to an on-chain delegation</text>

  <rect class="b" x="30" y="70" width="165" height="92"/>
  <text class="t h" x="112" y="104" text-anchor="middle">Developer endpoint</text>
  <text class="t s" x="112" y="126" text-anchor="middle">June: poisoned Homebrew</text>
  <text class="t s" x="112" y="144" text-anchor="middle">Sept: fake interview</text>

  <path class="ar" d="M195 116 H220"/>

  <rect class="b" x="220" y="70" width="165" height="92"/>
  <text class="t h" x="302" y="104" text-anchor="middle">Endpoint lost</text>
  <text class="t s" x="302" y="126" text-anchor="middle">dev tool swapped</text>
  <text class="t s" x="302" y="144" text-anchor="middle">C2, not detected</text>

  <path class="ar" d="M385 116 H410"/>

  <rect class="b" x="410" y="70" width="165" height="92"/>
  <text class="t h" x="492" y="104" text-anchor="middle">Internal AI tool</text>
  <text class="t s" x="492" y="126" text-anchor="middle">run from his laptop</text>
  <text class="t s" x="492" y="144" text-anchor="middle">pivot to two more</text>

  <path class="ar" d="M575 116 H600"/>

  <rect class="b" x="600" y="70" width="165" height="92"/>
  <text class="t h" x="682" y="104" text-anchor="middle">Deploy token</text>
  <text class="t s" x="682" y="126" text-anchor="middle">container permissions</text>
  <text class="t s" x="682" y="144" text-anchor="middle">left on a laptop</text>

  <path class="ar" d="M765 116 H790"/>

  <rect class="warn" x="790" y="70" width="180" height="92"/>
  <text class="t h" x="880" y="104" text-anchor="middle">Signing service</text>
  <text class="t s" x="880" y="126" text-anchor="middle">container, then script</text>
  <text class="t s" x="880" y="144" text-anchor="middle">bypasses withdrawals</text>

  <text class="t note" x="30" y="206">On-chain result: EIP-7702 points the hot wallet's bytecode at an attacker contract. Pausing withdrawals closes a workflow, not a state that already exists.</text>

  <rect class="acc" x="30" y="226" width="940" height="50"/>
  <text class="t h" x="50" y="248">Three boundaries, drawn wrong</text>
  <text class="t s" x="50" y="266">endpoints holding production authority · containment without scope · on-chain state decoupled from off-chain controls</text>
</svg>
