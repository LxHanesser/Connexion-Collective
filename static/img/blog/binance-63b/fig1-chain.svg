<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="币安事件的五段攻击链：两次投递进入开发者终端，借内部 AI 工具横移到钱包团队成员，用落在笔记本上的部署令牌进入签名服务，最终在链上落下持久授权">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#ffffff; stroke:#d7dee7; stroke-width:1.5; rx:12; }
      .acc { fill:#f0f9f4; stroke:#2e8555; stroke-width:1.5; rx:12; }
      .warn { fill:#fff7ed; stroke:#c2410c; stroke-width:1.5; rx:12; }
      .t { font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; fill:#1c1e21; }
      .h { font-size:14px; font-weight:600; }
      .s { font-size:11.5px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a1); }
      .note { font-size:12px; fill:#475569; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#f8fafc"/>
  <text class="t h" x="30" y="34">币安事件：从一条招聘信息到一笔链上授权</text>

  <rect class="b" x="30" y="70" width="165" height="92"/>
  <text class="t h" x="112" y="104" text-anchor="middle">开发者终端</text>
  <text class="t s" x="112" y="126" text-anchor="middle">6 月 Homebrew 投毒</text>
  <text class="t s" x="112" y="144" text-anchor="middle">9 月假面试作业</text>

  <path class="ar" d="M195 116 H220"/>

  <rect class="b" x="220" y="70" width="165" height="92"/>
  <text class="t h" x="302" y="104" text-anchor="middle">端点失守</text>
  <text class="t s" x="302" y="126" text-anchor="middle">开发工具被替换</text>
  <text class="t s" x="302" y="144" text-anchor="middle">回连 C2 未检出</text>

  <path class="ar" d="M385 116 H410"/>

  <rect class="b" x="410" y="70" width="165" height="92"/>
  <text class="t h" x="492" y="104" text-anchor="middle">内部 AI 工具</text>
  <text class="t s" x="492" y="126" text-anchor="middle">借被控终端操作</text>
  <text class="t s" x="492" y="144" text-anchor="middle">横移至两名工程师</text>

  <path class="ar" d="M575 116 H600"/>

  <rect class="b" x="600" y="70" width="165" height="92"/>
  <text class="t h" x="682" y="104" text-anchor="middle">部署令牌</text>
  <text class="t s" x="682" y="126" text-anchor="middle">容器部署权限</text>
  <text class="t s" x="682" y="144" text-anchor="middle">躺在工程师笔记本</text>

  <path class="ar" d="M765 116 H790"/>

  <rect class="warn" x="790" y="70" width="180" height="92"/>
  <text class="t h" x="880" y="104" text-anchor="middle">钱包签名服务</text>
  <text class="t s" x="880" y="126" text-anchor="middle">部署容器执行脚本</text>
  <text class="t s" x="880" y="144" text-anchor="middle">绕过提现流程</text>

  <text class="t note" x="30" y="206">链上结局：EIP-7702 把委托写进热钱包的字节码 —— 停提现关掉的是流程入口，管不到已经存在的状态。</text>

  <rect class="acc" x="30" y="226" width="940" height="50"/>
  <text class="t h" x="50" y="248">三处边界错位</text>
  <text class="t s" x="50" y="266">终端与生产权限未隔离　·　处置只做止损、未清算影响面　·　链上状态与链下风控解耦</text>
</svg>
