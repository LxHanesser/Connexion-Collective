<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Image compression pipeline in the browser: pick, decode, resize, encode, download — nothing is uploaded">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#d7dee7; stroke-width:1.5; rx:12; }
      .acc { fill:#f0f9f4; stroke:#2e8555; stroke-width:1.5; rx:12; }
      .t { font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; fill:#1c1e21; }
      .h { font-size:15px; font-weight:600; }
      .s { font-size:12px; fill:#64748b; }
      .m { font-family:"Cascadia Code",Consolas,monospace; font-size:11.5px; fill:#0f172a; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a1); }
      .note { font-size:12.5px; fill:#475569; }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#f8fafc"/>

  <text class="t h" x="30" y="40">Five steps for one image, all inside the browser</text>
  <text class="t note" x="30" y="64">No step needs a server: the file is read from disk, compressed, and written back.</text>

  <rect class="b" x="30" y="96" width="160" height="80"/>
  <text class="t h" x="110" y="128" text-anchor="middle">Pick file</text>
  <text class="t s" x="110" y="150" text-anchor="middle">input / drag &amp; drop</text>

  <path class="ar" d="M190 136 H228"/>
  <rect class="b" x="228" y="96" width="160" height="80"/>
  <text class="t h" x="308" y="128" text-anchor="middle">Decode</text>
  <text class="t m" x="308" y="150" text-anchor="middle">createImageBitmap</text>

  <path class="ar" d="M388 136 H426"/>
  <rect class="b" x="426" y="96" width="160" height="80"/>
  <text class="t h" x="506" y="128" text-anchor="middle">Resize</text>
  <text class="t m" x="506" y="150" text-anchor="middle">canvas.width</text>

  <path class="ar" d="M586 136 H624"/>
  <rect class="b" x="624" y="96" width="160" height="80"/>
  <text class="t h" x="704" y="128" text-anchor="middle">Encode</text>
  <text class="t m" x="704" y="150" text-anchor="middle">toBlob(type, q)</text>

  <path class="ar" d="M784 136 H822"/>
  <rect class="acc" x="822" y="96" width="148" height="80"/>
  <text class="t h" x="896" y="128" text-anchor="middle">Download</text>
  <text class="t s" x="896" y="150" text-anchor="middle">Blob back to disk</text>

  <text class="t note" x="30" y="216">Key points: handle EXIF orientation while decoding, resize once, and try two or three quality values for a target size.</text>
  <text class="t note" x="30" y="242">PNG is lossless, so the quality argument does nothing — switch to a lossy format to shrink it.</text>
  <text class="t note" x="30" y="268">On mobile, watch the canvas ceiling: images wider than roughly 16,384 px simply fail.</text>
</svg>
