<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="水印定位九宫格与批量处理流程：解码、绘制、编码、导出">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#d7dee7; stroke-width:1.5; rx:10; }
      .t { font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; fill:#1c1e21; }
      .h { font-size:14px; font-weight:600; }
      .s { font-size:11.5px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a6); }
      .note { font-size:12.5px; fill:#475569; }
      .cell { fill:#f1f5f9; stroke:#cbd5e1; stroke-width:1; }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#f8fafc"/>
  <text class="t h" x="30" y="34">九宫格定位：位置用比例，不用像素</text>

  <g>
    <rect class="cell" x="30" y="52" width="80" height="56"/><rect class="cell" x="112" y="52" width="80" height="56"/><rect class="cell" x="194" y="52" width="80" height="56"/>
    <rect class="cell" x="30" y="110" width="80" height="56"/><rect class="cell" x="112" y="110" width="80" height="56"/><rect class="cell" x="194" y="110" width="80" height="56"/>
    <rect class="cell" x="30" y="168" width="80" height="56"/><rect class="cell" x="112" y="168" width="80" height="56"/><rect class="cell" x="194" y="168" width="80" height="56"/>
  </g>
  <text class="t s" x="152" y="246" text-anchor="middle">3 × 3 锚点</text>

  <path class="ar" d="M310 140 H370"/>
  <rect class="b" x="370" y="70" width="150" height="78"/>
  <text class="t h" x="445" y="100" text-anchor="middle">绘制</text>
  <text class="t s" x="445" y="122" text-anchor="middle">描边 + 填充</text>

  <path class="ar" d="M520 109 H580"/>
  <rect class="b" x="580" y="70" width="150" height="78"/>
  <text class="t h" x="655" y="100" text-anchor="middle">编码</text>
  <text class="t s" x="655" y="122" text-anchor="middle">toBlob</text>

  <path class="ar" d="M730 109 H790"/>
  <rect class="b" x="790" y="70" width="180" height="78"/>
  <text class="t h" x="880" y="100" text-anchor="middle">批量导出</text>
  <text class="t s" x="880" y="122" text-anchor="middle">限并发 · 逐行下载</text>

  <text class="t note" x="560" y="200">白色文字压在浅色背景上会消失 —— 先描边，再填充。</text>
  <text class="t note" x="560" y="226">并发 2–4：太高会同时解码多张位图，内存翻倍。</text>
  <text class="t note" x="560" y="252">连续 click() 会被浏览器拦截，改 ZIP 或逐行按钮。</text>
</svg>
