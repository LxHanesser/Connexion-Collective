<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Docusaurus 部署到 Cloudflare Pages 的完整链路">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d7dee7; stroke-width: 1.5; rx: 12; }
      .box-accent { fill: #f0f9f4; stroke: #2e8555; stroke-width: 1.5; rx: 12; }
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1c1e21; }
      .title { font-size: 17px; font-weight: 600; }
      .sub { font-size: 13px; fill: #64748b; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; fill: #0f172a; }
      .arrow { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .label { font-size: 12px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1000" height="470" fill="#f8fafc"/>

  <!-- Row 1 -->
  <rect class="box" x="30" y="50" width="200" height="96"/>
  <text class="t title" x="130" y="82" text-anchor="middle">本地仓库</text>
  <text class="t sub" x="130" y="105" text-anchor="middle">你的电脑 / 编辑器</text>
  <text class="t mono" x="130" y="126" text-anchor="middle">git push</text>

  <path class="arrow" d="M230 98 H282"/>
  <text class="t label" x="256" y="86" text-anchor="middle">push</text>

  <rect class="box" x="282" y="50" width="200" height="96"/>
  <text class="t title" x="382" y="82" text-anchor="middle">GitHub 仓库</text>
  <text class="t sub" x="382" y="105" text-anchor="middle">main 分支 + PR</text>
  <text class="t mono" x="382" y="126" text-anchor="middle">webhook</text>

  <path class="arrow" d="M482 98 H534"/>
  <text class="t label" x="508" y="86" text-anchor="middle">触发</text>

  <rect class="box-accent" x="534" y="50" width="216" height="96"/>
  <text class="t title" x="642" y="78" text-anchor="middle">Cloudflare 构建机</text>
  <text class="t mono" x="642" y="101" text-anchor="middle">npm ci</text>
  <text class="t mono" x="642" y="120" text-anchor="middle">npm run build</text>
  <text class="t mono" x="642" y="139" text-anchor="middle">→ build/</text>

  <path class="arrow" d="M750 98 H802"/>

  <rect class="box" x="802" y="50" width="168" height="96"/>
  <text class="t title" x="886" y="82" text-anchor="middle">部署</text>
  <text class="t sub" x="886" y="105" text-anchor="middle">原子替换</text>
  <text class="t sub" x="886" y="126" text-anchor="middle">可回滚到任意版本</text>

  <!-- preview branch -->
  <path class="arrow" d="M382 146 V196 H534"/>
  <text class="t label" x="404" y="182">非 main 分支</text>

  <rect class="box" x="534" y="196" width="216" height="74"/>
  <text class="t title" x="642" y="226" text-anchor="middle">预览部署</text>
  <text class="t mono" x="642" y="250" text-anchor="middle">&lt;hash&gt;.项目.pages.dev</text>

  <!-- edge -->
  <path class="arrow" d="M886 146 V300" />
  <rect class="box" x="534" y="300" width="436" height="88"/>
  <text class="t title" x="752" y="330" text-anchor="middle">全球边缘节点</text>
  <text class="t sub" x="752" y="352" text-anchor="middle">HTML：不缓存 / 必须回源校验</text>
  <text class="t sub" x="752" y="372" text-anchor="middle">/assets/*：一年 immutable 强缓存</text>

  <path class="arrow" d="M752 388 V408"/>

  <rect class="box-accent" x="534" y="408" width="436" height="46"/>
  <text class="t title" x="752" y="436" text-anchor="middle">访客浏览器</text>

  <!-- note -->
  <text class="t label" x="30" y="232">说明：构建发生在 Cloudflare 的机器上，</text>
  <text class="t label" x="30" y="252">本地不需要任何服务器，也不需要上传 build/。</text>
  <text class="t label" x="30" y="284">PR 会自动得到独立预览地址，</text>
  <text class="t label" x="30" y="304">合并进 main 才会上到正式域名。</text>
</svg>
