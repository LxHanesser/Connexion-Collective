<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="HTML 与静态资源在 Cloudflare 边缘的不同缓存行为">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1c1e21; }
      .h { font-size: 15px; font-weight: 600; }
      .s { font-size: 12.5px; fill: #64748b; }
      .m { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .ar { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#a2); }
      .card { fill: #ffffff; stroke: #d7dee7; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect width="1000" height="430" fill="#f8fafc"/>

  <!-- A: HTML -->
  <rect class="card" x="24" y="24" width="952" height="180"/>
  <text class="t h" x="48" y="56" fill="#b45309">HTML 页面（/、/blog/、文章页…）</text>
  <text class="t s" x="48" y="78">内容会变，必须让边缘回源确认最新版本</text>

  <rect class="card" x="48" y="98" width="150" height="66"/>
  <text class="t s" x="123" y="126" text-anchor="middle">访客</text>
  <text class="t m" x="123" y="148" text-anchor="middle">GET /blog/</text>

  <path class="ar" d="M198 131 H268"/>
  <rect class="card" x="268" y="98" width="190" height="66"/>
  <text class="t s" x="363" y="126" text-anchor="middle">边缘节点</text>
  <text class="t m" x="363" y="148" text-anchor="middle">cf-cache-status: DYNAMIC</text>

  <path class="ar" d="M458 131 H528"/>
  <rect class="card" x="528" y="98" width="190" height="66"/>
  <text class="t s" x="623" y="126" text-anchor="middle">Pages 源站</text>
  <text class="t m" x="623" y="148" text-anchor="middle">返回最新 index.html</text>

  <path class="ar" d="M718 131 H788"/>
  <rect class="card" x="788" y="98" width="164" height="66"/>
  <text class="t s" x="870" y="126" text-anchor="middle">每次都要回源</text>
  <text class="t m" x="870" y="148" text-anchor="middle">Cache-Control: max-age=0</text>

  <!-- B: assets -->
  <rect class="card" x="24" y="224" width="952" height="182"/>
  <text class="t h" x="48" y="256" fill="#2e8555">静态资源（/assets/js/*.js、/assets/css/*.css）</text>
  <text class="t s" x="48" y="278">文件名带内容哈希，内容变了名字就变 —— 所以可以放心缓存一年</text>

  <rect class="card" x="48" y="298" width="150" height="66"/>
  <text class="t s" x="123" y="326" text-anchor="middle">访客</text>
  <text class="t m" x="123" y="348" text-anchor="middle">GET main.9f3a.js</text>

  <path class="ar" d="M198 331 H268"/>
  <rect class="card" x="268" y="298" width="190" height="66"/>
  <text class="t s" x="363" y="326" text-anchor="middle">边缘节点</text>
  <text class="t m" x="363" y="348" text-anchor="middle">第一次：MISS</text>

  <path class="ar" d="M458 331 H528"/>
  <rect class="card" x="528" y="298" width="190" height="66"/>
  <text class="t s" x="623" y="326" text-anchor="middle">Pages 源站</text>
  <text class="t m" x="623" y="348" text-anchor="middle">读一次文件</text>

  <path class="ar" d="M718 331 H788"/>
  <rect class="card" x="788" y="298" width="164" height="66"/>
  <text class="t s" x="870" y="326" text-anchor="middle">之后：HIT</text>
  <text class="t m" x="870" y="348" text-anchor="middle">max-age=31536000</text>

  <text class="t s" x="48" y="392">结果：同一份 600 KB 的 JS，一个访客只回源一次，之后由离他最近的节点直接返回。</text>
</svg>
