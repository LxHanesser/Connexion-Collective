<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="EXIF orientation values and coordinate spaces: display coordinates versus source pixels">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#d7dee7; stroke-width:1.5; rx:10; }
      .img { fill:#e2e8f0; stroke:#94a3b8; stroke-width:1.2; rx:4; }
      .t { font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; fill:#1c1e21; }
      .h { font-size:14px; font-weight:600; }
      .s { font-size:11.5px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a5); }
      .note { font-size:12.5px; fill:#475569; }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#f8fafc"/>
  <text class="t h" x="30" y="36">EXIF orientation: the pixels never change, only the tag</text>

  <rect class="img" x="40" y="64" width="120" height="80"/>
  <text class="t s" x="100" y="160" text-anchor="middle">1 normal</text>

  <rect class="img" x="200" y="64" width="120" height="80"/>
  <text class="t s" x="260" y="160" text-anchor="middle">3 rotate 180°</text>

  <rect class="img" x="370" y="64" width="80" height="120"/>
  <text class="t s" x="410" y="204" text-anchor="middle">6 rotate 90° CW</text>

  <rect class="img" x="520" y="64" width="80" height="120"/>
  <text class="t s" x="560" y="204" text-anchor="middle">8 rotate 90° CCW</text>

  <path class="ar" d="M650 124 H710"/>
  <rect class="b" x="710" y="84" width="260" height="80"/>
  <text class="t h" x="840" y="114" text-anchor="middle">Normalize while decoding</text>
  <text class="t s" x="840" y="138" text-anchor="middle">createImageBitmap + from-image</text>

  <text class="t note" x="30" y="248">Every later crop and rotate then works in display space, with no EXIF parsing.</text>
  <text class="t note" x="30" y="274">Apply orientation once — if decoding did it, do not rotate again by hand.</text>
</svg>
