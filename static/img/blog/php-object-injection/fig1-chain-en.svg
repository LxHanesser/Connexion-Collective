<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="PHP object injection chain: user input reaches unserialize, triggers magic methods, forms a gadget chain and performs a dangerous operation">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#d7dee7; stroke-width:1.5; rx:12; }
      .acc { fill:#f0f9f4; stroke:#2e8555; stroke-width:1.5; rx:12; }
      .warn { fill:#fff7ed; stroke:#c2410c; stroke-width:1.5; rx:12; }
      .t { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill:#1c1e21; }
      .h { font-size:13.5px; font-weight:600; }
      .s { font-size:11px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a2); }
      .note { font-size:11.5px; fill:#475569; }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#f8fafc"/>
  <text class="t h" x="30" y="34">Object injection chain: from a content submission to code execution</text>

  <rect class="b" x="30" y="70" width="165" height="92"/>
  <text class="t h" x="112" y="104" text-anchor="middle">User input</text>
  <text class="t s" x="112" y="126" text-anchor="middle">a serialized string</text>
  <text class="t s" x="112" y="144" text-anchor="middle">form / comment / profile</text>

  <path class="ar" d="M195 116 H220"/>
  <rect class="b" x="220" y="70" width="165" height="92"/>
  <text class="t h" x="302" y="104" text-anchor="middle">unserialize()</text>
  <text class="t s" x="302" y="126" text-anchor="middle">restores an object</text>
  <text class="t s" x="302" y="144" text-anchor="middle">class chosen by input</text>

  <path class="ar" d="M385 116 H410"/>
  <rect class="b" x="410" y="70" width="165" height="92"/>
  <text class="t h" x="492" y="104" text-anchor="middle">Magic methods</text>
  <text class="t s" x="492" y="126" text-anchor="middle">__wakeup / __destruct</text>
  <text class="t s" x="492" y="144" text-anchor="middle">called during restore</text>

  <path class="ar" d="M575 116 H600"/>
  <rect class="b" x="600" y="70" width="165" height="92"/>
  <text class="t h" x="682" y="104" text-anchor="middle">Gadget chain</text>
  <text class="t s" x="682" y="126" text-anchor="middle">A → B → C</text>
  <text class="t s" x="682" y="144" text-anchor="middle">more plugins, longer chain</text>

  <path class="ar" d="M765 116 H790"/>
  <rect class="warn" x="790" y="70" width="180" height="92"/>
  <text class="t h" x="880" y="104" text-anchor="middle">Dangerous sink</text>
  <text class="t s" x="880" y="126" text-anchor="middle">file write / command</text>
  <text class="t s" x="880" y="144" text-anchor="middle">depends on installed classes</text>

  <text class="t note" x="30" y="206">Impact is not a property of the bug. It is a property of the classes present on the target — the same payload behaves differently on different sites.</text>

  <rect class="acc" x="30" y="226" width="940" height="50"/>
  <text class="t h" x="50" y="248">Defence</text>
  <text class="t s" x="50" y="266">never unserialize user input　·　allowed_classes=false if unavoidable　·　prefer json_decode　·　fewer plugins, tighter editor roles</text>
</svg>
