<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Sensitivity chain: DPI times in-game sensitivity gives eDPI, then yaw gives cm/360">
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#d7dee7; stroke-width:1.5; rx:12; }
      .acc { fill:#eef6ff; stroke:#2563eb; stroke-width:1.5; rx:12; }
      .t { font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; fill:#1c1e21; }
      .h { font-size:14px; font-weight:600; }
      .m { font-family:"Cascadia Code",Consolas,monospace; font-size:12px; fill:#0f172a; }
      .s { font-size:11.5px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a8); }
      .note { font-size:12.5px; fill:#475569; }
    </style>
  </defs>
  <rect width="1000" height="280" fill="#f8fafc"/>
  <text class="t h" x="30" y="32">From hardware to feel</text>

  <rect class="b" x="30" y="54" width="170" height="70"/>
  <text class="t h" x="115" y="82" text-anchor="middle">DPI</text>
  <text class="t s" x="115" y="104" text-anchor="middle">hardware</text>

  <path class="ar" d="M200 89 H238"/>
  <text class="t s" x="219" y="76" text-anchor="middle">×</text>

  <rect class="b" x="238" y="54" width="170" height="70"/>
  <text class="t h" x="323" y="82" text-anchor="middle">In-game sens</text>
  <text class="t s" x="323" y="104" text-anchor="middle">game setting</text>

  <path class="ar" d="M408 89 H446"/>
  <rect class="acc" x="446" y="54" width="170" height="70"/>
  <text class="t h" x="531" y="82" text-anchor="middle">eDPI</text>
  <text class="t s" x="531" y="104" text-anchor="middle">same game only</text>

  <path class="ar" d="M616 89 H654"/>
  <text class="t s" x="635" y="76" text-anchor="middle">× yaw</text>

  <rect class="b" x="654" y="54" width="190" height="70"/>
  <text class="t h" x="749" y="82" text-anchor="middle">cm/360</text>
  <text class="t s" x="749" y="104" text-anchor="middle">comparable across games</text>

  <text class="t m" x="30" y="176">cm/360 = 360 / (DPI × sensitivity × yaw) × 2.54</text>

  <text class="t note" x="30" y="212">yaw: CS2 / Apex 0.022, Valorant 0.07, Overwatch 2 0.0066.</text>
  <text class="t note" x="30" y="238">Mouse acceleration breaks the formula; FOV and polling rate do not affect it.</text>
  <text class="t note" x="30" y="264">Before converting: make sure acceleration is off in the OS and in-game.</text>
</svg>
