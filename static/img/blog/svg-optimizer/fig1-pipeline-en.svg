<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="SVG optimization pipeline: read, parse, safety-clean, drop metadata, compress precision, serialize">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#d7dee7; stroke-width:1.5; rx:12; }
      .warn { fill:#fff7ed; stroke:#d97706; stroke-width:1.5; rx:12; }
      .t { font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; fill:#1c1e21; }
      .h { font-size:15px; font-weight:600; }
      .s { font-size:11.5px; fill:#64748b; }
      .ar { stroke:#94a3b8; stroke-width:1.8; fill:none; marker-end:url(#a4); }
      .note { font-size:12.5px; fill:#475569; }
    </style>
  </defs>
  <rect width="1000" height="280" fill="#f8fafc"/>
  <text class="t h" x="30" y="40">Four actions, with risk increasing from left to right</text>

  <rect class="b" x="30" y="70" width="170" height="78"/>
  <text class="t h" x="115" y="100" text-anchor="middle">Read text</text>
  <text class="t s" x="115" y="122" text-anchor="middle">DOMParser</text>

  <path class="ar" d="M200 109 H238"/>
  <rect class="warn" x="238" y="70" width="180" height="78"/>
  <text class="t h" x="328" y="100" text-anchor="middle">Safety clean</text>
  <text class="t s" x="328" y="122" text-anchor="middle">script / on* / external refs</text>

  <path class="ar" d="M418 109 H456"/>
  <rect class="b" x="456" y="70" width="170" height="78"/>
  <text class="t h" x="541" y="100" text-anchor="middle">Drop metadata</text>
  <text class="t s" x="541" y="122" text-anchor="middle">comments, editor attrs</text>

  <path class="ar" d="M626 109 H664"/>
  <rect class="b" x="664" y="70" width="150" height="78"/>
  <text class="t h" x="739" y="100" text-anchor="middle">Round numbers</text>
  <text class="t s" x="739" y="122" text-anchor="middle">6 → 2 digits</text>

  <path class="ar" d="M814 109 H852"/>
  <rect class="b" x="852" y="70" width="118" height="78"/>
  <text class="t h" x="911" y="100" text-anchor="middle">Serialize</text>
  <text class="t s" x="911" y="122" text-anchor="middle">XMLSerializer</text>

  <text class="t note" x="30" y="190">Clean for safety before optimizing size — reverse the order and the optimizer becomes the injection point.</text>
  <text class="t note" x="30" y="216">Never remove: ids, defs, or anything referenced by url(#id).</text>
  <text class="t note" x="30" y="242">Two decimals is the usual safe default; keep three for curved paths.</text>
</svg>
