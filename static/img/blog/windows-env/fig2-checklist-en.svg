<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Windows 开发环境需要安装的软件清单：Node.js、Git 必装，VS Code 与 Windows Terminal 可选">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1c1e21; }
      .h { font-size: 14.40px; font-weight: 600; }
      .s { font-size: 11.25px; fill: #64748b; }
      .m { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.25px; fill: #1d4ed8; }
      .card { fill: #ffffff; stroke: #d7dee7; stroke-width: 1.5; rx: 10; }
      .must { fill: #f0f9f4; stroke: #2e8555; stroke-width: 1.8; rx: 10; }
      .opt { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
      .badge { font-size: 9.90px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1000" height="440" fill="#f8fafc"/>
  <text class="t h" x="24" y="40" font-size="17">What to install: two required, two optional</text>

  <!-- Node -->
  <rect class="must" x="24" y="60" width="452" height="150"/>
  <rect x="44" y="80" width="54" height="22" rx="11" fill="#2e8555"/>
  <text class="t badge" x="71" y="96" text-anchor="middle" fill="#ffffff">Must</text>
  <text class="t h" x="112" y="98">Node.js (bundles npm)</text>
  <text class="t s" x="44" y="128">The runtime your project needs; npm ships with Node.</text>
  <text class="t s" x="44" y="150">Pick the LTS release, not Current.</text>
  <text class="m" x="44" y="180">nodejs.org/en/download</text>
  <text class="t s" x="44" y="200">Check: node -v and npm -v</text>

  <!-- Git -->
  <rect class="must" x="500" y="60" width="476" height="150"/>
  <rect x="520" y="80" width="54" height="22" rx="11" fill="#2e8555"/>
  <text class="t badge" x="547" y="96" text-anchor="middle" fill="#ffffff">Must</text>
  <text class="t h" x="588" y="98">Git for Windows</text>
  <text class="t s" x="520" y="128">For cloning code and committing changes; the installer includes Git Bash.</text>
  <text class="t s" x="520" y="150">Set your name and email once after installing.</text>
  <text class="m" x="520" y="180">git-scm.com/download/win</text>
  <text class="t s" x="520" y="200">Check: git --version</text>

  <!-- optional -->
  <rect class="opt" x="24" y="234" width="452" height="126"/>
  <text class="t h" x="44" y="264">Optional: VS Code</text>
  <text class="t s" x="44" y="288">An editor with a built-in terminal, so npm runs from inside it.</text>
  <text class="m" x="44" y="314">code.visualstudio.com/Download</text>
  <text class="t s" x="44" y="338">Optional — Notepad plus a terminal works too.</text>

  <rect class="opt" x="500" y="234" width="476" height="126"/>
  <text class="t h" x="520" y="264">Optional: Windows Terminal</text>
  <text class="t s" x="520" y="288">Better than the stock console: tabs, copy-paste, CJK support.</text>
  <text class="m" x="520" y="314">aka.ms/terminal (Microsoft Store)</text>
  <text class="t s" x="520" y="338">Preinstalled on Windows 11; Windows 10 may need it.</text>

  <!-- warning -->
  <rect x="24" y="382" width="952" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text class="t s" x="44" y="408" fill="#991b1b">⚠ Download only from the official addresses above. Third-party builds may be modified — never run login commands from them.</text>
</svg>
