<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Node.js 与 Git 安装向导里必须确认的选项">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1c1e21; }
      .h { font-size: 15px; font-weight: 600; }
      .s { font-size: 12.5px; fill: #64748b; }
      .m { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #d7dee7; stroke-width: 1.5; rx: 10; }
      .row { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .ok { fill: #2e8555; }
    </style>
  </defs>
  <rect width="1000" height="520" fill="#f8fafc"/>

  <!-- Node installer -->
  <rect class="card" x="24" y="24" width="460" height="300"/>
  <text class="t h" x="44" y="54">Node.js 安装向导（MSI）</text>
  <text class="t s" x="44" y="76">一路 Next，只在下面这页停一下：</text>

  <rect class="row" x="44" y="92" width="420" height="46"/>
  <rect x="58" y="104" width="16" height="16" rx="3" fill="#2e8555"/>
  <path d="M61 112 l4 4 l7 -8" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="t m" x="86" y="116">Add to PATH</text>
  <text class="t s" x="86" y="132">让 node 和 npm 能在任意目录下运行 —— 必须勾</text>

  <rect class="row" x="44" y="146" width="420" height="46"/>
  <rect x="58" y="158" width="16" height="16" rx="3" fill="#2e8555"/>
  <path d="M61 166 l4 4 l7 -8" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="t m" x="86" y="170">npm package manager</text>
  <text class="t s" x="86" y="186">npm 会跟着一起装好，不用单独安装</text>

  <rect class="row" x="44" y="200" width="420" height="46"/>
  <rect x="58" y="212" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t m" x="86" y="224" fill="#64748b">Tools for Native Modules</text>
  <text class="t s" x="86" y="240">普通前端项目用不到，不勾可以少装一堆编译工具</text>

  <text class="t s" x="44" y="276">装完点 Finish。此时终端里 node -v 应该能输出版本号。</text>
  <text class="t s" x="44" y="300">如果没反应，先关掉终端重新开一个（PATH 只在启动时读取）。</text>

  <!-- Git installer -->
  <rect class="card" x="508" y="24" width="468" height="300"/>
  <text class="t h" x="528" y="54">Git for Windows 安装向导</text>
  <text class="t s" x="528" y="76">一路 Next，只看这三页：</text>

  <rect class="row" x="528" y="92" width="428" height="46"/>
  <text class="t m" x="544" y="114">PATH environment</text>
  <text class="t s" x="544" y="130">选 “Git from the command line and also from 3rd-party software”（默认）</text>

  <rect class="row" x="528" y="146" width="428" height="46"/>
  <text class="t m" x="544" y="168">Initial branch name</text>
  <text class="t s" x="544" y="184">选 Override，填 main —— 和现在主流仓库保持一致</text>

  <rect class="row" x="528" y="200" width="428" height="46"/>
  <text class="t m" x="544" y="222">Line ending conversions</text>
  <text class="t s" x="544" y="238">保持默认（Checkout Windows-style, commit Unix-style）</text>

  <text class="t s" x="528" y="276">编辑器那页随便选，Notepad 也行，以后可以改。</text>
  <text class="t s" x="528" y="300">装完会多一个「Git Bash」，下面很多命令都能在里面跑。</text>

  <!-- bottom note -->
  <rect x="24" y="344" width="952" height="152" rx="10" fill="#f0f9f4" stroke="#2e8555" stroke-width="1.5"/>
  <text class="t h" x="48" y="376" fill="#14532d">装完之后，还要做两件事</text>
  <text class="t m" x="48" y="406">git config --global user.name "你的名字"</text>
  <text class="t m" x="48" y="430">git config --global user.email "你的邮箱"</text>
  <text class="t s" x="48" y="456" fill="#166534">这两行是提交记录的署名，不配置的话第一次 commit 会直接报错。</text>
  <text class="t s" x="48" y="480" fill="#166534">邮箱建议与 GitHub 账号一致，否则提交不会算到你的贡献图里。</text>
</svg>
