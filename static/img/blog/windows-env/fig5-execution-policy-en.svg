<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="PowerShell 执行策略导致 npm.ps1 无法运行，以及一行命令修复">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1c1e21; }
      .h { font-size: 13.50px; font-weight: 600; }
      .s { font-size: 11.25px; fill: #64748b; }
      .term { fill: #0f172a; rx: 10; }
      .tt { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.25px; fill: #e2e8f0; }
      .p { fill: #4ade80; }
      .r { fill: #fca5a5; }
      .o { fill: #93c5fd; }
    </style>
  </defs>
  <rect width="1000" height="450" fill="#f8fafc"/>
  <text class="t h" x="24" y="36" font-size="16">The second most common error: npm.ps1 cannot be loaded</text>
  <text class="t s" x="24" y="58">With Node installed, node -v works but npm prints a wall of red — that is Windows' script execution policy, not a broken install.</text>

  <rect class="term" x="24" y="76" width="620" height="170"/>
  <text class="tt p" x="48" y="108">PS C:\Users\you&gt;</text>
  <text class="tt" x="228" y="108">npm -v</text>
  <text class="tt r" x="48" y="134">npm : File C:\Program Files\nodejs\npm.ps1 cannot be loaded</text>
  <text class="tt r" x="48" y="158">because running scripts is disabled on this system.</text>
  <text class="tt" x="48" y="184" fill="#94a3b8">+ CategoryInfo          : SecurityError: (:) [], PSSecurityException</text>
  <text class="tt" x="48" y="208" fill="#94a3b8">+ FullyQualifiedErrorId : UnauthorizedAccess</text>
  <text class="tt" x="48" y="232" fill="#64748b"># but node -v works, so Node itself is fine</text>

  <!-- fix -->
  <rect x="668" y="76" width="308" height="170" rx="10" fill="#ffffff" stroke="#d7dee7" stroke-width="1.5"/>
  <text class="t h" x="690" y="108">One-line fix</text>
  <rect x="688" y="122" width="268" height="52" rx="6" fill="#0f172a"/>
  <text class="tt o" x="702" y="144">Set-ExecutionPolicy -Scope</text>
  <text class="tt o" x="702" y="164">CurrentUser RemoteSigned</text>
  <text class="t s" x="690" y="198">Current user only; no admin rights.</text>
  <text class="t s" x="690" y="220">Press Y to confirm, then reopen the terminal.</text>

  <!-- explanation -->
  <rect x="24" y="276" width="952" height="150" rx="10" fill="#f0f9f4" stroke="#2e8555" stroke-width="1.5"/>
  <text class="t h" x="48" y="308" fill="#14532d">Why this happens</text>
  <text class="t s" x="48" y="336" fill="#166534">Windows blocks local .ps1 scripts by default, and npm starts through npm.ps1 in PowerShell.</text>
  <text class="t s" x="48" y="360" fill="#166534">RemoteSigned means: local scripts run, downloaded scripts must be signed — safer than Unrestricted.</text>
  <text class="t s" x="48" y="384" fill="#166534">If you would rather not change the policy, use Git Bash (installed with Git); it is not affected.</text>
  <text class="t s" x="48" y="408" fill="#166534">Verify with npm -v — it should print a version this time.</text>
</svg>
